name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          echo "SDK: $ANDROID_HOME"
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AxClaude-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AxClaude.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" AxClaude.apk --title "Ax Claude (build ${{ github.run_number }})" --notes "Install AxClaude.apk on your phone." --latest
